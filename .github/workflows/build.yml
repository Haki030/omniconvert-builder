name: Build Android Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Android Keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "OmniConvertPass123" -keypass "OmniConvertPass123" \
            -dname "CN=OmniConvert, OU=App, O=OmniConvert, L=Swansea, S=Wales, C=GB"

      - name: Initialize Android Project
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "app.netlify.omniconvertor030.twa",
            "host": "omniconvertor030.netlify.app",
            "name": "OmniConvert Precision Converter",
            "launcherName": "OmniConvert",
            "themeColor": "#030712",
            "navigationColor": "#030712",
            "backgroundColor": "#030712",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://omniconvertor030.netlify.app/icon-512.png",
            "maskableIconUrl": "https://omniconvertor030.netlify.app/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://omniconvertor030.netlify.app/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            }
          }
          EOF
          bubblewrap init --manifest=twa-manifest.json

      - name: Build Signed Android Package
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: OmniConvertPass123
          BUBBLEWRAP_KEY_PASSWORD: OmniConvertPass123
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload Play Store Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniConvert-GooglePlay-Package
          path: |
            *.aab
            *.apk
            android.keystore
